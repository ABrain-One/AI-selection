[build-system]
requires = ['setuptools>=77', 'wheel']
build-backend = 'setuptools.build_meta'

[project]
name = 'nn-rank'
dynamic = ['version', 'dependencies']
description = 'Ranking of AI Systems by the Accuracy-Resource Trade-off'
readme = { file = 'README.md', content-type = 'text/markdown' }
license = 'Apache-2.0'
license-files = ['LICENSE']
requires-python = '>=3.10'
classifiers = [
    'Programming Language :: Python :: 3',
    'Operating System :: OS Independent',
    'Topic :: Scientific/Engineering :: Artificial Intelligence',
    'Topic :: Scientific/Engineering :: Information Analysis',
    'Topic :: Software Development :: Libraries',
    'Intended Audience :: Developers',
    'Intended Audience :: Science/Research',
]

keywords = ['neural network ranking', 'model selection', 'AI system', 'accuracy latency trade-off', 'pareto front', 'quality resource trade-off', 'inference cost analysis', 'model efficiency benchmark', 'deep learning model comparison', 'python model ranking', 'minimax regret', 'model selection under price uncertainty']
authors = [{ name = 'ABrain-One', email = 'AI@ABrain.one' }]

[project.urls]
Homepage = 'https://ABrain.one'
Repository = 'https://github.com/ABrain-One/nn-rank'
'Bug Tracker' = 'https://github.com/ABrain-One/nn-rank/issues'

[tool.setuptools.dynamic]
version = { file = 'version' }
dependencies = { file = 'requirements.txt' }

[tool.setuptools.packages.find]
where = ['']
include = ['ab*']
namespaces = true

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
'*' = ['requirements.txt', 'LICENSE', 'version', '*.md']
